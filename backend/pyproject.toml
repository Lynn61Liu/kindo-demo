[project]
name = "kindo-demo-backend"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
