name: kindo-demo

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: kindo
      POSTGRES_PASSWORD: kindo_local_demo
      POSTGRES_DB: school_pay_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindo -d school_pay_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
